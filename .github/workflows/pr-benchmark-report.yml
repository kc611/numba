name: PR benchmark report

on:
  workflow_run:
    workflows: ["PR benchmark"]
    types: [completed]

permissions:
  contents: read

env:
  BENCHMARK_REPO: numba/numba-benchmark

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          path: benchmark
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          path: plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read plan
        id: plan
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value)"' plan/plan.json >> "$GITHUB_OUTPUT"

      - name: Merge results
        run: python benchmark/src/bench.py merge artifacts --out pr-results/

      - name: Render comment
        env:
          PR: ${{ steps.plan.outputs.pr }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
          HEAD_REPO: ${{ steps.plan.outputs.head_repo }}
          MAIN_SHA: ${{ steps.plan.outputs.main_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python .github/scripts/pr_benchmark_comment.py \
            --results pr-results \
            --head "$HEAD_SHA" \
            --base "$MAIN_SHA" \
            --pr "$PR" \
            --head-repo "$HEAD_REPO" \
            --run-url "$RUN_URL" \
            --out comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.plan.outputs.pr }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('comment.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = Number(process.env.PR)
            const marker = '<!-- numba-pr-benchmark -->'
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            })
            if (pr.head.sha !== process.env.HEAD_SHA) {
              core.info(
                `PR head moved to ${pr.head.sha}; ` +
                `skipping comment for benchmarked ${process.env.HEAD_SHA}`
              )
              return
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            })
            const existing = comments.find(comment => comment.body.includes(marker))
            const { data } = existing
              ? await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              : await github.rest.issues.createComment({ owner, repo, issue_number, body })
            core.info(`Updated ${data.html_url}`)
